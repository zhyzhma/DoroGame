server:
  port: 8080

spring:
  application:
    name: game-service
  datasource:
    url: jdbc:postgresql://localhost:5433/gamedb
    username: user
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8085/realms/dorogame_realm}

grpc:
  client:
    user-service:
      address: static://localhost:9090
      negotiation-type: plaintext

game:
  starting:
    player1:
      - x: 0
        y: 0
      - x: 0
        y: 1
      - x: 0
        y: 4
      - x: 0
        y: 5
    player2:
      - x: 8
        y: 0
      - x: 8
        y: 1
      - x: 8
        y: 4
      - x: 8
        y: 5
